name: smoke

on:
  push:
  pull_request:

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libssl-dev python3 python3-yaml
      - name: Build and smoke test
        run: bash scripts/smoke_test.sh
