    variant: nopad
    role: ablation

  LOCI-NoPublicRefresh:
    scheme: loci
    variant: nopublicrefresh
    role: ablation

  LOCI-NoProto:
    scheme: loci
    variant: noproto
    role: ablation

  Sim-L_cert:
    simulated: true
    role: certified_leakage_simulation
